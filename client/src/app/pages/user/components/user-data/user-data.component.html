<main class="container app-main">
    @if (user$ | async) {
        <div class="mt-5 col-12 col-md-8 mx-auto position-relative">
    
            <div class="row">
                <h4 class="col-12 mb-3">Tus datos de usuario</h4>
                <div class="col-12">
                    <div class="card">
                        @if (loading) {
                            <app-loader class="loader" size="lg"></app-loader>
                        }
                        <div class="card-body">
                            <form class="form-row mt-3" [formGroup]="userForm" (submit)="saveEdition()">
                                <mat-form-field class="w-100" appearance="outline">
                                    <mat-label>Email:</mat-label>
                                    <input matInput type="email" formControlName="email">
                                </mat-form-field>
                                <mat-form-field class="w-100" appearance="outline">
                                    <mat-label>Usuario:</mat-label>
                                    <input matInput type="text" formControlName="username">
                                </mat-form-field>

                                <mat-form-field class="w-100" appearance="outline">
                                    <mat-label>Contraseña:</mat-label>
                                    <input matInput type="password" formControlName="password">
                                </mat-form-field>
                                
                                @if (passwordChangeIndicator) {
                                    <mat-form-field appearance="outline" class="w-100">
                                        <mat-label>Confirmar Contraseña:</mat-label>
                                        <input matInput type="password" formControlName="confirmation">
                                        @if (confirmationFormErrors['notSame']) {
                                            <mat-error>Ojo que las contraseñas no son iguales</mat-error>
                                        }
                                    </mat-form-field>
                                }
                                <div class="col-12 mb-3 mt-5 text-right">
                                    <button mat-raised-button type="submit">
                                        Guardar cambios
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
    
            </div>
            <div class="mt-5">
                <button mat-button (click)="goBack();">
                    Volver
                </button>
            </div>
    
        </div>
    }
</main>
