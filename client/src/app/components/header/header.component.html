@if (baseRoute$ | async; as route) {
  <div class="container-fluid main-header">
    <div class="d-flex px-md-4 py-2">
  
      <div class="col-3 text-left">
        <button mat-button class="ml-auto"(click)="getOut()">Salir</button>
      </div>
      
      <div class="my-auto col-6 ">World of Story</div>
      
      <div class="col-3 text-right">
        <button mat-icon-button (click)="openMenu(route)">
          <mat-icon aria-hidden="false" aria-label="menu" fontIcon="menu"></mat-icon>
        </button>
      </div>
  
    </div>
  </div>
}
